<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Skim — turn videos into 20 seconds of reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B0E14;
    --ink-raised: #10141C;
    --paper: #EDEBE3;
    --slate: #7C8699;
    --line: #1E2430;
    --amber: #FFB020;
    --amber-dim: #664B14;
    --danger: #E5484D;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
  }

  .mono {
    font-family: 'IBM Plex Mono', monospace;
  }

  a { color: var(--amber); }

  /* ---------- header ---------- */
  header {
    width: 100%;
    max-width: 640px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 64px;
  }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--paper);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
  }

  .tier-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--slate);
    letter-spacing: 0.04em;
  }

  /* ---------- hero ---------- */
  .hero {
    width: 100%;
    max-width: 640px;
    text-align: left;
    margin-bottom: 40px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--amber);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }

  h1 {
    font-size: clamp(32px, 6vw, 44px);
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
  }

  .sub {
    font-size: 16px;
    color: var(--slate);
    line-height: 1.5;
    margin: 0;
    max-width: 46ch;
  }

  /* ---------- form ---------- */
  form {
    width: 100%;
    max-width: 640px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }

  input[type="url"] {
    flex: 1;
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    padding: 15px 16px;
    outline: none;
    transition: border-color 0.15s ease;
    min-width: 0;
  }

  input[type="url"]::placeholder { color: #4A5265; }

  input[type="url"]:focus {
    border-color: var(--amber);
  }

  input[type="url"]:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  button {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    background: var(--amber);
    color: var(--ink);
    border: none;
    border-radius: var(--radius);
    padding: 0 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:hover { background: #FFC04D; }
  button:active { transform: scale(0.98); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  button:disabled {
    background: var(--amber-dim);
    color: #8A7237;
    cursor: not-allowed;
  }

  button .play-icon {
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 8px solid var(--ink);
    flex-shrink: 0;
  }

  /* ---------- timeline (signature element) ---------- */
  .timeline-wrap {
    height: 0;
    overflow: hidden;
    transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .timeline-wrap.active { height: 54px; }

  .timeline {
    position: relative;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 22px 0 10px;
    overflow: visible;
  }

  .timeline .playhead {
    position: absolute;
    top: 50%;
    left: 0;
    width: 10px;
    height: 10px;
    margin-top: -5px;
    margin-left: -5px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber);
    animation: scrub 1.6s ease-in-out infinite;
  }

  @keyframes scrub {
    0%   { left: 0%; }
    50%  { left: 100%; }
    100% { left: 0%; }
  }

  .timeline .fill {
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: linear-gradient(90deg, transparent, var(--amber-dim));
    width: 100%;
    opacity: 0.4;
  }

  .status-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--slate);
    letter-spacing: 0.02em;
  }

  /* ---------- result ---------- */
  .result {
    width: 100%;
    max-width: 640px;
    margin-top: 8px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }

  .result.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .result-card {
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 26px 26px 22px;
  }

  .result-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  .result-meta .video-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--slate);
  }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--slate);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 6px;
  }

  .copy-btn:hover { background: var(--line); color: var(--paper); }

  .summary-text {
    font-size: 15.5px;
    line-height: 1.7;
    color: var(--paper);
    white-space: pre-wrap;
  }

  .summary-text::first-line {
    font-weight: 600;
  }

  /* ---------- error ---------- */
  .error-box {
    width: 100%;
    max-width: 640px;
    margin-top: 18px;
    padding: 14px 16px;
    background: rgba(229, 72, 77, 0.08);
    border: 1px solid rgba(229, 72, 77, 0.3);
    border-radius: var(--radius);
    color: #F5A3A5;
    font-size: 14px;
    display: none;
  }

  .error-box.visible { display: block; }

  /* ---------- footer ---------- */
  footer {
    margin-top: auto;
    padding-top: 56px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #3D4457;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  @media (max-width: 480px) {
    .input-row { flex-direction: column; }
    button { padding: 15px; justify-content: center; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo"><span class="dot"></span>SKIM</div>
    <div class="tier-badge mono" id="tierBadge">— summaries left today</div>
  </header>

  <div class="hero">
    <p class="eyebrow">runtime → readtime</p>
    <h1>Watch less.<br>Know more.</h1>
    <p class="sub">Paste a YouTube link. Get the transcript's TL;DR before the video would've finished buffering.</p>
  </div>

  <form id="summarizeForm">
    <div class="input-row">
      <input
        type="url"
        id="urlInput"
        placeholder="https://youtube.com/watch?v=…"
        required
        autocomplete="off"
        inputmode="url"
      >
      <button type="submit" id="submitBtn">
        <span class="play-icon"></span>
        <span id="btnLabel">SUMMARIZE</span>
      </button>
    </div>

    <div class="timeline-wrap" id="timelineWrap">
      <div class="timeline">
        <div class="fill"></div>
        <div class="playhead"></div>
      </div>
      <div class="status-line mono" id="statusLine">reading transcript…</div>
    </div>
  </form>

  <div class="error-box" id="errorBox"></div>

  <div class="result" id="result">
    <div class="result-card">
      <div class="result-meta">
        <span class="video-id mono" id="videoId"></span>
        <button class="copy-btn mono" id="copyBtn">COPY</button>
      </div>
      <div class="summary-text" id="summaryText"></div>
    </div>
  </div>

  <footer>skim runs on your device's free tier · bring your own key for unlimited use</footer>

<script>
  const form = document.getElementById('summarizeForm');
  const urlInput = document.getElementById('urlInput');
  const submitBtn = document.getElementById('submitBtn');
  const btnLabel = document.getElementById('btnLabel');
  const timelineWrap = document.getElementById('timelineWrap');
  const statusLine = document.getElementById('statusLine');
  const result = document.getElementById('result');
  const summaryText = document.getElementById('summaryText');
  const videoId = document.getElementById('videoId');
  const errorBox = document.getElementById('errorBox');
  const copyBtn = document.getElementById('copyBtn');
  const tierBadge = document.getElementById('tierBadge');

  const statusMessages = ['reading transcript…', 'writing summary…', 'almost there…'];

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    urlInput.disabled = isLoading;
    timelineWrap.classList.toggle('active', isLoading);
    btnLabel.textContent = isLoading ? 'WORKING' : 'SUMMARIZE';
  }

  function cycleStatus() {
    let i = 0;
    statusLine.textContent = statusMessages[0];
    return setInterval(() => {
      i = (i + 1) % statusMessages.length;
      statusLine.textContent = statusMessages[i];
    }, 2200);
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('visible');
    result.classList.remove('visible');
  }

  function hideError() {
    errorBox.classList.remove('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    result.classList.remove('visible');
    setLoading(true);
    const statusInterval = cycleStatus();

    try {
      const res = await fetch('/summarize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: urlInput.value.trim() }),
      });

      const data = await res.json();

      if (!res.ok) {
        const detail = Array.isArray(data.detail)
          ? data.detail.map(d => d.msg).join(' ')
          : (data.detail || 'Something went wrong. Try again.');
        throw new Error(detail);
      }

      videoId.textContent = data.video_id;
      summaryText.textContent = data.summary;
      result.classList.add('visible');

      if (typeof data.remaining_today === 'number') {
        tierBadge.textContent = `${data.remaining_today} summaries left today`;
      }
    } catch (err) {
      showError(err.message || 'Couldn\u2019t reach the server. Try again in a moment.');
    } finally {
      clearInterval(statusInterval);
      setLoading(false);
    }
  });

  copyBtn.addEventListener('click', async () => {
    await navigator.clipboard.writeText(summaryText.textContent);
    copyBtn.textContent = 'COPIED';
    setTimeout(() => (copyBtn.textContent = 'COPY'), 1500);
  });
</script>

</body>
</html>
